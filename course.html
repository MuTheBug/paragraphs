<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JusticeCMS — Course</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════════════════════════
     COURSE APP SHELL
══════════════════════════════════ -->
<div class="course-app" id="app">

  <!-- ── Header ── -->
  <header class="course-header">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
      <a href="index.html" class="course-logo">Justice<span>CMS</span></a>
      <span class="header-sep">|</span>
      <span class="header-crumb" id="headerCrumb">Select a lesson</span>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <input type="search" id="searchInput" class="search-input" placeholder="Search lessons…" autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="progress-ring-wrap" title="Overall progress">
        <svg class="progress-ring" width="36" height="36" viewBox="0 0 36 36">
          <circle class="ring-bg" cx="18" cy="18" r="14" fill="none" stroke-width="3"/>
          <circle class="ring-fill" id="ringFill" cx="18" cy="18" r="14" fill="none" stroke-width="3"
            stroke-dasharray="87.96" stroke-dashoffset="87.96" transform="rotate(-90 18 18)"/>
        </svg>
        <span class="ring-pct" id="ringPct">0%</span>
      </div>
    </div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="course-sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-search-hint">Navigate with ← →</div>
      <nav id="sidebarNav"></nav>
    </div>
  </aside>

  <!-- ── Overlay (mobile) ── -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ── Main content ── -->
  <main class="course-main" id="courseMain">
    <div id="lessonArea">
      <!-- Populated by JS -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-inner">
          <div class="welcome-icon">⚖️</div>
          <h1>Welcome to JusticeCMS</h1>
          <p>Select a module from the sidebar to begin. Start with <strong>Module 00</strong> if you're new.</p>
          <button class="btn-primary" onclick="app.goToFirst()">Start from the Beginning →</button>
          <div class="welcome-stats" id="welcomeStats"></div>
        </div>
      </div>
      <div class="lesson-wrapper" id="lessonWrapper" style="display:none"></div>
    </div>
  </main>

</div><!-- /course-app -->

<!-- ══════════════════════════════════
     INLINE STYLES (course-specific)
══════════════════════════════════ -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--navy); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }

/* ── Layout shell ── */
.course-app { display: flex; flex-direction: column; height: 100vh; }
.course-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--header-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 1rem;
  background: var(--navy-mid); border-bottom: 1px solid var(--border);
}
.header-left { display: flex; align-items: center; gap: .7rem; min-width: 0; }
.header-right { display: flex; align-items: center; gap: .8rem; flex-shrink: 0; }
.sidebar-toggle {
  background: none; border: none; color: var(--text); font-size: 1.2rem;
  cursor: pointer; padding: .3rem .5rem; border-radius: 4px;
  transition: background var(--transition);
}
.sidebar-toggle:hover { background: var(--navy-light); }
.course-logo { font-size: 1rem; font-weight: 800; color: var(--gold); white-space: nowrap; text-decoration: none; }
.course-logo span { color: var(--text); }
.header-sep { color: var(--border); }
.header-crumb { font-size: .82rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }

/* ── Search ── */
.search-wrap { position: relative; }
.search-input {
  background: var(--navy); border: 1px solid var(--border);
  color: var(--text); padding: .35rem .8rem; border-radius: var(--radius);
  font-size: .82rem; width: 200px; outline: none;
  transition: border-color var(--transition), width .2s;
}
.search-input:focus { border-color: var(--gold); width: 260px; }
.search-results {
  position: absolute; top: calc(100% + 6px); right: 0;
  width: 320px; background: var(--navy-mid); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  max-height: 320px; overflow-y: auto; display: none; z-index: 300;
}
.search-results.open { display: block; }
.search-result-item {
  padding: .65rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border);
  font-size: .82rem; transition: background var(--transition);
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover, .search-result-item.active { background: var(--navy-light); }
.search-result-item strong { color: var(--gold); display: block; font-size: .78rem; }

/* ── Progress ring ── */
.progress-ring-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
.ring-bg { stroke: var(--border); }
.ring-fill { stroke: var(--gold); transition: stroke-dashoffset .4s; }
.ring-pct { position: absolute; font-size: .6rem; font-weight: 700; color: var(--gold); }

/* ── Sidebar ── */
.course-sidebar {
  position: fixed; top: var(--header-h); left: 0; bottom: 0;
  width: var(--sidebar-w); z-index: 150;
  background: var(--navy-mid); border-right: 1px solid var(--border);
  overflow-y: auto; transition: transform var(--transition);
}
.sidebar-inner { padding: .5rem 0 2rem; }
.sidebar-search-hint { font-size: .7rem; color: var(--text-muted); padding: .5rem 1rem; text-align: center; }
.sidebar-overlay {
  display: none; position: fixed; inset: 0; z-index: 140;
  background: rgba(0,0,0,.6);
}

/* Sidebar nav tree */
.sidebar-module { }
.sidebar-module-header {
  display: flex; align-items: center; gap: .5rem;
  padding: .55rem 1rem; cursor: pointer;
  font-size: .82rem; font-weight: 700; color: var(--text-muted);
  user-select: none; transition: color var(--transition), background var(--transition);
  border-left: 3px solid transparent;
}
.sidebar-module-header:hover { color: var(--text); background: var(--navy-light); }
.sidebar-module-header.active { color: var(--gold); border-left-color: var(--gold); }
.sidebar-module-header .mod-badge {
  flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 50%;
  background: rgba(201,162,39,.1); border: 1px solid rgba(201,162,39,.2);
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; color: var(--gold);
}
.sidebar-module-header .mod-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-module-header .chevron { font-size: .7rem; transition: transform .2s; margin-left: auto; }
.sidebar-module-header.open .chevron { transform: rotate(90deg); }
.sidebar-module-header .mod-check { font-size: .7rem; color: var(--green); }

.sidebar-lessons { display: none; }
.sidebar-lessons.open { display: block; }
.sidebar-lesson {
  display: flex; align-items: center; gap: .5rem;
  padding: .42rem .8rem .42rem 2.8rem;
  font-size: .8rem; color: var(--text-muted); cursor: pointer;
  transition: color var(--transition), background var(--transition);
  border-left: 3px solid transparent;
  text-decoration: none;
}
.sidebar-lesson:hover { color: var(--text); background: var(--navy-light); }
.sidebar-lesson.active { color: var(--blue-light); border-left-color: var(--blue); background: rgba(46,125,196,.08); }
.sidebar-lesson.done { color: var(--green); }
.sidebar-lesson.done::before { content: '✓'; font-size: .7rem; color: var(--green); flex-shrink: 0; }
.sidebar-lesson:not(.done)::before { content: '○'; font-size: .6rem; flex-shrink: 0; }

/* ── Main content ── */
.course-main {
  margin-left: var(--sidebar-w);
  margin-top: var(--header-h);
  min-height: calc(100vh - var(--header-h));
  padding: 0;
}

/* ── Welcome screen ── */
.welcome-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - var(--header-h)); padding: 2rem;
}
.welcome-inner { text-align: center; max-width: 500px; }
.welcome-icon { font-size: 3.5rem; margin-bottom: 1rem; }
.welcome-inner h1 { font-size: 1.8rem; font-weight: 800; color: var(--white); margin-bottom: .8rem; }
.welcome-inner p { color: var(--text-muted); margin-bottom: 1.8rem; }
.btn-primary {
  background: var(--gold); color: var(--navy); border: none;
  padding: .8rem 2rem; border-radius: var(--radius);
  font-weight: 700; font-size: 1rem; cursor: pointer;
  transition: background var(--transition);
}
.btn-primary:hover { background: var(--gold-light); }
.welcome-stats { margin-top: 2rem; font-size: .82rem; color: var(--text-muted); }
.welcome-stats strong { color: var(--gold); }

/* ── Lesson wrapper ── */
.lesson-wrapper { padding: 2.5rem 3rem; max-width: 860px; }

/* ── Lesson header ── */
.lesson-header { margin-bottom: 2rem; }
.lesson-meta { display: flex; align-items: center; gap: .7rem; margin-bottom: .6rem; flex-wrap: wrap; }
.lesson-tag {
  font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
  padding: .2rem .6rem; border-radius: 2rem;
  background: rgba(201,162,39,.12); color: var(--gold); border: 1px solid rgba(201,162,39,.25);
}
.lesson-num { font-size: .72rem; color: var(--text-muted); }
.lesson-time { font-size: .72rem; color: var(--text-muted); }
.lesson-time::before { content: '⏱ '; }
.lesson-title { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; color: var(--white); line-height: 1.2; }
.lesson-intro { font-size: 1rem; color: var(--text-muted); margin-top: .6rem; max-width: 640px; line-height: 1.7; }

/* ── Build tracker ── */
.build-tracker {
  display: flex; align-items: center; gap: .8rem;
  padding: .8rem 1.2rem; margin-bottom: 2rem;
  background: rgba(40,167,69,.08); border: 1px solid rgba(40,167,69,.25);
  border-radius: var(--radius); font-size: .85rem;
}
.build-tracker .bt-icon { font-size: 1.2rem; }
.build-tracker .bt-label { color: var(--text-muted); font-size: .75rem; display: block; }
.build-tracker .bt-value { color: var(--green); font-weight: 700; }

/* ── Lesson body prose ── */
.lesson-body { line-height: 1.8; font-size: .95rem; color: var(--text); }
.lesson-body h2 { font-size: 1.3rem; font-weight: 800; color: var(--white); margin: 2rem 0 .7rem; padding-bottom: .4rem; border-bottom: 1px solid var(--border); }
.lesson-body h3 { font-size: 1.05rem; font-weight: 700; color: var(--white); margin: 1.5rem 0 .5rem; }
.lesson-body p { margin-bottom: 1rem; }
.lesson-body ul, .lesson-body ol { margin: .5rem 0 1rem 1.5rem; }
.lesson-body li { margin-bottom: .35rem; }
.lesson-body strong { color: var(--white); }
.lesson-body code {
  background: var(--code-bg); color: var(--gold-light);
  padding: .1rem .4rem; border-radius: 4px; font-size: .85em;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}
.lesson-body a { color: var(--blue-light); text-decoration: underline; }
.lesson-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

/* ── Callouts ── */
.callout {
  display: flex; gap: .9rem; padding: 1rem 1.2rem;
  border-radius: var(--radius); margin: 1.2rem 0;
  border-left: 4px solid; font-size: .9rem;
}
.callout .callout-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: .05rem; }
.callout .callout-body { flex: 1; }
.callout .callout-body strong { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .6px; margin-bottom: .3rem; }
.callout.info  { background: rgba(46,125,196,.1);  border-color: var(--blue);   color: #b3d4f0; }
.callout.info  .callout-body strong { color: var(--blue-light); }
.callout.warn  { background: rgba(232,131,58,.1);  border-color: var(--orange); color: #f0cdb3; }
.callout.warn  .callout-body strong { color: var(--orange); }
.callout.tip   { background: rgba(40,167,69,.1);   border-color: var(--green);  color: #b3f0c2; }
.callout.tip   .callout-body strong { color: var(--green); }
.callout.key   { background: rgba(201,162,39,.1);  border-color: var(--gold);   color: #f0dcb3; }
.callout.key   .callout-body strong { color: var(--gold); }

/* ── Code blocks ── */
.code-block { margin: 1.5rem 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.code-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: .5rem 1rem; background: #0a1520;
  border-bottom: 1px solid var(--border); font-size: .78rem;
}
.code-lang { color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
.code-file { color: var(--text-muted); font-size: .72rem; }
.btn-copy {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  padding: .2rem .6rem; border-radius: 4px; font-size: .72rem; cursor: pointer;
  transition: border-color var(--transition), color var(--transition);
}
.btn-copy:hover { border-color: var(--gold); color: var(--gold); }
.btn-copy.copied { border-color: var(--green); color: var(--green); }
.code-block pre {
  background: var(--code-bg); padding: 1.2rem; overflow-x: auto;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: .83rem; line-height: 1.7; color: var(--text); margin: 0;
}
.code-block pre .kw  { color: #c084fc; }
.code-block pre .fn  { color: #60a5fa; }
.code-block pre .st  { color: #86efac; }
.code-block pre .cm  { color: #64748b; font-style: italic; }
.code-block pre .num { color: #fb923c; }
.code-block pre .dec { color: #f472b6; }

/* ── Quiz ── */
.quiz-block {
  background: var(--navy-mid); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem; margin: 2rem 0;
}
.quiz-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gold); margin-bottom: .8rem; }
.quiz-question { font-size: .95rem; font-weight: 700; color: var(--white); margin-bottom: 1rem; line-height: 1.5; }
.quiz-options { display: flex; flex-direction: column; gap: .5rem; }
.quiz-option {
  display: flex; align-items: flex-start; gap: .7rem;
  padding: .75rem 1rem; border-radius: var(--radius);
  border: 1px solid var(--border); cursor: pointer; font-size: .88rem;
  transition: border-color .15s, background .15s; background: var(--navy);
}
.quiz-option:hover:not(.locked) { border-color: var(--blue); }
.quiz-option.correct { border-color: var(--green); background: rgba(40,167,69,.1); color: var(--text); }
.quiz-option.wrong   { border-color: var(--red);   background: rgba(220,53,69,.1); color: var(--text); }
.quiz-option .opt-letter {
  flex-shrink: 0; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--navy-light); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 800; color: var(--text-muted);
}
.quiz-option.correct .opt-letter { background: var(--green); color: var(--navy); border-color: var(--green); }
.quiz-option.wrong   .opt-letter { background: var(--red);   color: var(--white); border-color: var(--red); }
.quiz-explanation {
  margin-top: 1rem; padding: .8rem 1rem;
  background: rgba(46,125,196,.08); border-left: 3px solid var(--blue);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: .85rem; color: var(--text-muted); display: none;
}
.quiz-explanation.visible { display: block; }
.quiz-score { font-size: .8rem; color: var(--text-muted); margin-top: .8rem; text-align: right; }

/* ── Exercise ── */
.exercise {
  border: 1px solid rgba(201,162,39,.3); border-radius: var(--radius);
  padding: 1.5rem; margin: 2rem 0;
  background: rgba(201,162,39,.05);
}
.exercise-badge {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--gold); color: var(--navy);
  padding: .25rem .8rem; border-radius: 2rem;
  font-size: .72rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: .6px; margin-bottom: 1rem;
}
.exercise h3 { color: var(--white); font-size: 1rem; margin-bottom: .6rem; }
.exercise p, .exercise li { color: var(--text-muted); font-size: .88rem; }
.exercise ul { margin: .5rem 0 .5rem 1.5rem; }
.exercise li { margin-bottom: .3rem; }

/* ── Terminal ── */
.terminal {
  background: #0a0f1a; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin: 1.5rem 0;
}
.terminal-titlebar {
  background: #1a2030; padding: .5rem .8rem;
  display: flex; align-items: center; gap: .5rem;
}
.terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
.terminal-dot.red    { background: #ff5f57; }
.terminal-dot.yellow { background: #febc2e; }
.terminal-dot.green  { background: #28c840; }
.terminal-label { margin-left: .5rem; font-size: .72rem; color: var(--text-muted); }
.terminal-output {
  padding: .8rem 1rem; font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: .8rem; line-height: 1.7; color: #c8d8e8; min-height: 60px;
  max-height: 360px; overflow-y: auto;
}
.terminal-output .t-prompt { color: #86efac; }
.terminal-output .t-cmd    { color: var(--white); }
.terminal-output .t-out    { color: #94a3b8; }
.terminal-output .t-err    { color: #f87171; }
.terminal-output .t-info   { color: #60a5fa; }
.terminal-input-row {
  display: flex; align-items: center; gap: .4rem;
  padding: .4rem .8rem .6rem; border-top: 1px solid rgba(255,255,255,.05);
}
.terminal-input-row .t-prompt { font-family: monospace; font-size: .8rem; color: #86efac; white-space: nowrap; }
.terminal-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--white); font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: .8rem; caret-color: var(--gold);
}
.terminal-hint { font-size: .7rem; color: var(--text-muted); padding: 0 1rem .5rem; }

/* ── Bottom lesson nav ── */
.lesson-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 3rem; padding: 1.5rem 0; border-top: 1px solid var(--border); gap: 1rem;
}
.lesson-nav-btn {
  display: flex; align-items: center; gap: .5rem;
  padding: .7rem 1.2rem; border-radius: var(--radius);
  background: var(--navy-mid); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; font-size: .85rem;
  transition: border-color var(--transition), background var(--transition);
  text-decoration: none;
}
.lesson-nav-btn:hover { border-color: var(--gold); }
.lesson-nav-btn.disabled { opacity: .4; pointer-events: none; }
.lesson-nav-btn .nav-arrow { font-size: 1rem; }
.lesson-nav-btn .nav-sub { font-size: .72rem; color: var(--text-muted); display: block; }
.lesson-nav-btn .nav-name { font-weight: 600; display: block; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark-complete-btn {
  background: var(--green); color: var(--navy); border: none;
  padding: .7rem 1.5rem; border-radius: var(--radius);
  font-weight: 700; font-size: .85rem; cursor: pointer;
  transition: background var(--transition), transform .1s;
  white-space: nowrap;
}
.mark-complete-btn:hover { background: #34d058; transform: scale(1.02); }
.mark-complete-btn.done { background: var(--navy-mid); color: var(--green); border: 1px solid var(--green); cursor: default; }
.mark-complete-btn.done:hover { transform: none; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .lesson-wrapper { padding: 1.5rem 1.2rem; }
  .header-crumb { display: none; }
}
@media (max-width: 768px) {
  .course-sidebar { transform: translateX(-100%); }
  .course-sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .course-main { margin-left: 0; }
  .search-input { width: 140px; }
  .search-input:focus { width: 200px; }
}
@media (max-width: 480px) {
  .lesson-nav { flex-direction: column; }
  .lesson-nav-btn, .mark-complete-btn { width: 100%; justify-content: center; }
}
</style>

<!-- Scripts (order matters: content first, then app) -->
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
